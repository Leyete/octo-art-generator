name: 15-Minute Octo-Art Generator

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes (:00, :15, :30, :45)
  workflow_dispatch:        # Allows manual execution anytime

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Octo-App Engine
        run: python octo_app.py

      - name: Commit and push generated art
        run: |
          git config --global user.name "Octo-Art-Bot"
          git config --global user.email "octobot@users.noreply.github.com"
          git add index.html gallery/
          git commit -m "🐙 Octo-Bot: Generated new artwork (15-min cycle)" || exit 0
          git push
