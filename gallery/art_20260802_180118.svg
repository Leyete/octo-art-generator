<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
    <defs>
        <radialGradient id="sunGlow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
            <stop offset="35%" stop-color="#431407" stop-opacity="0.6" />
            <stop offset="80%" stop-color="#2c1a12" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#0f0b08" stop-opacity="1" />
        </radialGradient>
        <filter id="canvasTexture">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
            <feColorMatrix type="saturate" values="0.1" />
            <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
            <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
        <filter id="softGlow"><feGaussianBlur stdDeviation="8" /></filter>
    </defs>
    <rect width="900" height="900" fill="#0f0b08" />
    <rect width="900" height="900" fill="url(#sunGlow)" filter="url(#canvasTexture)" />
    <ellipse cx="450" cy="380" rx="320" ry="140" fill="#fbbf24" opacity="0.25" filter="url(#softGlow)" /><polygon points="0,620 220,410 480,650" fill="#431407" opacity="0.95" /><polygon points="280,650 580,360 850,660" fill="#2c1a12" opacity="0.9" /><polygon points="550,660 740,430 900,640" fill="#04070d" opacity="0.95" /><path d="M 0,640 Q 250,590 450,680 T 900,630 L 900,900 L 0,900 Z" fill="#020408" /><ellipse cx="450" cy="740" rx="280" ry="25" fill="#fbbf24" opacity="0.35" filter="url(#softGlow)" /><ellipse cx="448" cy="628" rx="7" ry="7" fill="#000000" /><path d="M 440,635 L 456,635 L 460,670 L 436,670 Z" fill="#000000" /><line x1="458" y1="635" x2="462" y2="690" stroke="#000000" stroke-width="2" /><path d="M 40,650 Q 20,530 80,420 Q 120,520 100,650 Z" fill="#030509" /><path d="M 820,640 Q 800,510 860,400 Q 890,510 870,640 Z" fill="#030509" /></svg>